name: Charcoal ERB browser acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Retain exact preceding ERB and server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6cd9a5bd9db0ed6087f6991dfbd79e751deefc65
          path: .baseline
          persist-credentials: false
      - name: Check out the actual Ithon frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: .ithon
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Lib/ithon_run.py
            Lib/ithon_frontend.py
            Lib/ithon_static.py
      - run: python3 -m venv .browser-runtime
      - run: .browser-runtime/bin/pip install playwright==1.56.0
      - run: .browser-runtime/bin/python -m playwright install --with-deps chromium
      - name: Check and execute maintained Ithon browser acceptance
        env:
          ITHON_CHECK_RECEIPT: ${{ github.workspace }}/ithon-check-receipt.jsonl
        run: .browser-runtime/bin/python .ithon/Lib/ithon_run.py examples/autogenerated/charcoal-browser/check.pi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dumbstore-charcoal-browser
          path: |
            build/charcoal/
            ithon-check-receipt.jsonl
          if-no-files-found: warn
